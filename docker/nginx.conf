worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # DNS resolver for dynamic upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream definitions
    upstream frontend { server frontend:80; }
    upstream registry { server registry-service:8000; }
    upstream watchlist { server watchlist-service:8000; }
    upstream alert { server alert-service:8000; }
    upstream search { server search-service:8000; }
    upstream auth { server auth-service:8000; }

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── HTTP → HTTPS redirect ───────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS server ────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # API routing
        location /api/v1/auth/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/cameras {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://registry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 10M;
        }

        location /api/v1/watchlist {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://watchlist;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/alerts {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://alert;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/vehicles {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/stats {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/integrations {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/reports {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket for alerts
        location /api/v1/alerts/ws {
            proxy_pass http://alert;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        # AI Service (dynamic upstream)
        location /api/v1/ai/ {
            limit_req zone=api burst=5 nodelay;
            set $ai_upstream http://ai-service:8000;
            proxy_pass $ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 50M;
        }

        # Sentinel HLS relay — MediaMTX pulls RTSP from Sentinel, re-serves as local HLS
        location /sentinel/live/ {
            rewrite ^/sentinel/live/(.*)$ /$1 break;
            proxy_pass http://mediamtx:8888;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Catch MediaMTX cookie-check redirect (relative /camXX/ paths)
        location ~ ^/cam\d+/ {
            proxy_pass http://mediamtx:8888;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Forward all browser cookies to MediaMTX for session auth
            proxy_set_header Cookie $http_cookie;
            # Pass through Set-Cookie from MediaMTX
            proxy_cookie_path / /;
        }
    }
}
